---
- name: Configuração do Host Cliente (cli)
  hosts: all
  become: true

  tasks:
    # ─── 1. Pacotes X11 ───
    - name: Instalar firefox-esr e xauth
      apt:
        name:
          - firefox-esr
          - xauth
        state: present
        update_cache: true

    # ─── 2. SSH X11 Forwarding ───
    - name: Permitir exportação X11 no SSH
      lineinfile:
        path: /etc/ssh/ssh_config
        regexp: '^#?\s*ForwardX11\s'
        line: 'ForwardX11 yes'
        state: present
      notify: restart ssh

    - name: Permitir X11Trusted no SSH
      lineinfile:
        path: /etc/ssh/ssh_config
        regexp: '^#?\s*ForwardX11Trusted\s'
        line: 'ForwardX11Trusted yes'
        state: present
      notify: restart ssh

    # ─── 3. Autofs (NFS) ───
    - name: Instalar autofs
      apt:
        name: autofs
        state: present

    - name: Criar o diretório /var/nfs
      file:
        path: /var/nfs
        state: directory
        mode: '0755'

    - name: Configurar o auto.master
      copy:
        dest: /etc/auto.master
        content: |
          /var/nfs /etc/auto.nfs --timeout=60

    - name: Configurar o auto.nfs para montar a arq
      copy:
        dest: /etc/auto.nfs
        content: |
          dados -fstype=nfs4,rw 192.168.56.104:/dados/nfs

    - name: Reiniciar o autofs
      service:
        name: autofs
        state: restarted
        enabled: yes

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted
