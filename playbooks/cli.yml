---
- ansible.builtin.import_playbook: conf-geral.yml
  vars:
    alvo_comum: cli
    usar_dns_lab: true

- name: Configurar o cliente
  hosts: cli
  become: true
  vars_files:
    - vars-lab.yml

  tasks:
    - name: Instalar Firefox ESR e xauth
      ansible.builtin.apt:
        name: [firefox-esr, xauth]
        state: present
        lock_timeout: 180

    - name: Habilitar encaminhamento X11 no servidor SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ifpb-x11.conf
        mode: '0644'
        content: "X11Forwarding yes\n"
      notify: Recarregar SSH

    - name: Validar a configuração SSH
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Configurar a montagem automática do NFS
      ansible.builtin.import_tasks: autofs.yml

  handlers:
    - name: Recarregar autofs
      ansible.builtin.service:
        name: autofs
        state: reloaded

    - name: Recarregar SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
