---
- name: Cliente cli - Firefox, X11 e NFS por autofs
  hosts: all
  become: true
  tasks:
    - name: Instalar Firefox, Xauth e autofs
      ansible.builtin.apt:
        name: [firefox-esr, xauth, autofs]
        state: present
        update_cache: true
    - name: Permitir X11 forwarding no servidor SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/02-ifpb-x11.conf
        mode: '0644'
        content: "X11Forwarding yes\nX11UseLocalhost yes\n"
      notify: Recarregar SSH
    - name: Configurar automontagem direta NFS em /var/nfs
      ansible.builtin.copy:
        dest: /etc/auto.master.d/ifpb.autofs
        mode: '0644'
        content: "/- /etc/auto.ifpb --timeout=60\n"
      notify: Reiniciar autofs
    - name: Configurar mapa de montagem NFS
      ansible.builtin.copy:
        dest: /etc/auto.ifpb
        mode: '0644'
        content: "/var/nfs -fstype=nfs,rw 192.168.56.104:/dados/nfs\n"
      notify: Reiniciar autofs
    - name: Ativar autofs
      ansible.builtin.service:
        name: autofs
        state: started
        enabled: true
  handlers:
    - name: Recarregar SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
    - name: Reiniciar autofs
      ansible.builtin.service:
        name: autofs
        state: restarted
