---
- name: Configuração do Host Cliente (cli)
  hosts: all
  become: true
  vars:
    ip_arq: 192.168.56.104

  tasks:
    # ─── 1. Pacotes X11 ───
    - name: Instalar firefox-esr e xauth
      apt:
        name:
          - firefox-esr
          - xauth
          - autofs
        state: present
        update_cache: true
      register: apt_result
      until: apt_result is succeeded
      retries: 4
      delay: 15

    # ─── 2. SSH X11 Forwarding ───
    - name: Permitir exportação X11 no SSH
      lineinfile:
        path: /etc/ssh/ssh_config
        regexp: '^#?\s*ForwardX11\s'
        line: 'ForwardX11 yes'
        state: present

    - name: Permitir X11Trusted no SSH
      lineinfile:
        path: /etc/ssh/ssh_config
        regexp: '^#?\s*ForwardX11Trusted\s'
        line: 'ForwardX11Trusted yes'
        state: present

    # ─── 3. Autofs (NFS) ───
    - name: Configurar o auto.nfs para montar a arq
      copy:
        dest: /etc/auto.nfs
        owner: root
        group: root
        mode: "0644"
        content: |
          dados -fstype=nfs4,rw {{ ip_arq }}:/dados/nfs
      notify: Reiniciar autofs

    - name: Adicionar mapa NFS sem substituir os demais mapas
      lineinfile:
        path: /etc/auto.master
        line: "/var/nfs /etc/auto.nfs --timeout=60"
        state: present
      notify: Reiniciar autofs

    - name: Criar ponto de montagem do autofs
      file:
        path: /var/nfs
        state: directory
        owner: root
        group: root
        mode: "0755"

  handlers:
    - name: Reiniciar autofs
      service:
        name: autofs
        state: restarted
        enabled: true
