
---
- name: Configuracao comum em todas as VMs
  hosts: all
  become: true

  vars:
    integrantes: [wagner, wilson]

  tasks:
    - name: Atualizar cache de pacotes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar pacotes comuns
      ansible.builtin.apt:
        name:
          - chrony
          - nfs-common
          - sudo
          - openssh-server
          - python3
        state: present

    - name: Ajustar zona de tempo
      community.general.timezone:
        name: America/Recife

    - name: Configurar o Chrony
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        mode: '0644'
        content: |
          pool pool.ntp.br iburst
          driftfile /var/lib/chrony/chrony.drift
          logdir /var/log/chrony
          makestep 1 3
          rtcsync
      notify: Reiniciar chrony

    - name: Garantir Chrony em execucao
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Criar grupo ifpb
      ansible.builtin.group:
        name: ifpb
        state: present

    - name: Criar integrantes e incluir no grupo ifpb
      ansible.builtin.user:
        name: "{{ item }}"
        groups: ifpb
        append: true
        create_home: true
        shell: /bin/bash
      loop: "{{ integrantes }}"

    - name: Confirmar existencia de chaves publicas no computador controlador
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.fileglob', playbook_dir + '/../keys/' + item + '.pub') | length > 0
        fail_msg: >-
          Falta keys/{{ item }}.pub.
          Rode ./preparar-chaves.sh no notebook Linux
          ANTES de provisionar.
      loop: "{{ integrantes }}"
      delegate_to: localhost
      become: false

    - name: Instalar chave publica do notebook no authorized_keys remoto
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ lookup('ansible.builtin.file', playbook_dir + '/../keys/' + item + '.pub') }}"
        state: present
        exclusive: true
        manage_dir: true
      loop: "{{ integrantes }}"

    - name: Instalar mensagem de acesso SSH
      ansible.builtin.copy:
        dest: /etc/ssh/banner_ifpb
        mode: '0644'
        content: "Acesso apenas para pessoas com autorização expressa!!!\n"
      notify: Recarregar SSH

    - name: Restringir acesso SSH a chaves e grupos autorizados
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-ifpb.conf
        mode: '0644'
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowGroups vagrant ifpb
          Banner /etc/ssh/banner_ifpb
      notify: Recarregar SSH

    - name: Permitir sudo sem senha aos integrantes para testes automatizados
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ifpb
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
        content: "%ifpb ALL=(ALL:ALL) NOPASSWD: ALL\n"

    - name: Verificar sintaxe SSH antes de aplicar
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

  handlers:
    - name: Reiniciar chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

    - name: Recarregar SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
