---
- name: Configuração geral das VMs
  hosts: all
  become: true

  vars:
    ifpb_group: "ifpb"
    user1: "wagner"
    user2: "wilson"
    ntp_pool: "pool.ntp.br"
    timezone: "America/Recife"
    ssh_banner: "Acesso apenas para pessoas com autorização expressa!!!"
    local_keys_dir: "{{ playbook_dir }}/../keys"

  tasks:
    # ─── 1. Atualizar o sistema ───
    - name: Atualizar cache e aplicar atualizacoes do sistema
      apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      register: apt_result
      until: apt_result is succeeded
      retries: 4
      delay: 15

    # ─── 2. Pacotes base ───
    - name: Instalar chrony, nfs-common e sudo
      apt:
        name:
          - chrony
          - nfs-common
          - sudo
          - openssh-server
        state: present
      register: apt_result
      until: apt_result is succeeded
      retries: 4
      delay: 15

    # ─── 3. Timezone ───
    - name: Ajustar timezone
      timezone:
        name: "{{ timezone }}"

    # ─── 4. chrony ───
    - name: Desabilitar systemd-timesyncd (conflita com chrony)
      systemd:
        name: systemd-timesyncd
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Configurar chrony com pool.ntp.br
      copy:
        dest: /etc/chrony/chrony.conf
        mode: "0644"
        content: |
          pool {{ ntp_pool }} iburst
          driftfile /var/lib/chrony/chrony.drift
          logdir /var/log/chrony
          maxupdateskew 100.0
          rtcsync
          makestep 1 3
      notify: restart chrony

    - name: Habilitar chrony
      service:
        name: chrony
        state: started
        enabled: true

    # ─── 5. Grupo ifpb + usuários ───
    - name: Criar grupo ifpb
      group:
        name: "{{ ifpb_group }}"
        state: present

    - name: Criar usuários no grupo ifpb
      user:
        name: "{{ item }}"
        groups: "{{ ifpb_group }}"
        append: yes
        shell: /bin/bash
        create_home: true
        state: present
      loop:
        - "{{ user1 }}"
        - "{{ user2 }}"

    # ─── 6. SSH ───
    - name: Garantir diretório sshd_config.d
      file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0755"

    - name: Criar banner SSH
      copy:
        dest: /etc/ssh/banner_ifpb
        mode: "0644"
        content: |
          {{ ssh_banner }}

    - name: Configurar sshd (chaves, root, grupos, banner)
      copy:
        dest: /etc/ssh/sshd_config.d/99-ifpb.conf
        mode: "0644"
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowGroups vagrant ifpb
          Banner /etc/ssh/banner_ifpb
      notify: restart ssh

    - name: Validar configuracao do SSH antes do reinicio
      command: /usr/sbin/sshd -t
      changed_when: false

    # ─── 7. Chaves SSH ───
    - name: Garantir que o diretório .ssh exista
      file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ ifpb_group }}"
        mode: '0700'
      loop:
        - "{{ user1 }}"
        - "{{ user2 }}"

    - name: Criar diretorio local protegido para as chaves
      file:
        path: "{{ local_keys_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Gerar chaves Ed25519 no controlador Ansible
      openssh_keypair:
        path: "{{ local_keys_dir }}/{{ item }}_id_ed25519"
        type: ed25519
        state: present
      loop:
        - "{{ user1 }}"
        - "{{ user2 }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Autorizar a chave pública no authorized_keys
      authorized_key:
        user: "{{ item }}"
        state: present
        key: "{{ lookup('file', local_keys_dir + '/' + item + '_id_ed25519.pub') }}"
      loop:
        - "{{ user1 }}"
        - "{{ user2 }}"

    # ─── 8. Sudo ───
    - name: Permitir sudo ao grupo ifpb
      copy:
        dest: /etc/sudoers.d/ifpb
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          %ifpb ALL=(ALL:ALL) ALL

  handlers:
    - name: restart chrony
      service:
        name: chrony
        state: restarted

    - name: restart ssh
      service:
        name: ssh
        state: restarted
