---
- name: Configuração do Servidor de Aplicação (app)
  hosts: all
  become: true

  tasks:
    # ─── 1. Apache ───
    - name: Instalar o Apache2
      apt:
        name: apache2
        state: present
        update_cache: true

    - name: Habilitar e iniciar o Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Criar o arquivo index.html com os dados do projeto
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Projeto DevOps - IFPB</title>
          </head>
          <body>
              <h1>Projeto 01 - DevOps com Vagrant e Ansible</h1>
              <p><strong>Disciplina:</strong> Administração de Sistemas Abertos</p>
              <p><strong>Professor:</strong> Leonidas Lima</p>
              <p><strong>Integrantes:</strong></p>
              <ul>
                  <li>Wagner - Matrícula: 04</li>
                  <li>Wilson - Matrícula: XX</li>
              </ul>
          </body>
          </html>
        mode: '0644'

    # ─── 2. Autofs (NFS) ───
    - name: Instalar autofs
      apt:
        name: autofs
        state: present

    - name: Criar o diretório /var/nfs
      file:
        path: /var/nfs
        state: directory
        mode: '0755'

    - name: Configurar o auto.master
      copy:
        dest: /etc/auto.master
        content: |
          /var/nfs /etc/auto.nfs --timeout=60

    - name: Configurar o auto.nfs para montar a arq
      copy:
        dest: /etc/auto.nfs
        content: |
          dados -fstype=nfs4,rw 192.168.56.104:/dados/nfs

    - name: Reiniciar o autofs
      service:
        name: autofs
        state: restarted
        enabled: yes
