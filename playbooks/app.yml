---
- name: Servidor app - Apache e NFS por autofs
  hosts: all
  become: true
  tasks:
    - name: Instalar Apache e autofs
      ansible.builtin.apt:
        name: [apache2, autofs]
        state: present
        update_cache: true
    - name: Habilitar Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
    - name: Publicar pagina HTML exigida
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: '0644'
        content: |
          <!doctype html>
          <html lang="pt-br"><head><meta charset="utf-8"><title>Projeto DevOps IFPB</title></head>
          <body><h1>Projeto 01 - DevOps com Vagrant e Ansible</h1>
          <p>IFPB - Administracao de Sistemas Abertos - Professor Leonidas Lima</p>
          <p>Wagner Marinho de Andrade Filho - 20242380004</p>
          <p>Wilson Fillipe do Nascimento Lima - 20251380021</p>
          </body></html>
    - name: Configurar automontagem direta NFS em /var/nfs
      ansible.builtin.copy:
        dest: /etc/auto.master.d/ifpb.autofs
        mode: '0644'
        content: "/- /etc/auto.ifpb --timeout=60\n"
      notify: Reiniciar autofs
    - name: Configurar mapa de montagem NFS
      ansible.builtin.copy:
        dest: /etc/auto.ifpb
        mode: '0644'
        content: "/var/nfs -fstype=nfs,rw 192.168.56.104:/dados/nfs\n"
      notify: Reiniciar autofs
    - name: Ativar autofs
      ansible.builtin.service:
        name: autofs
        state: started
        enabled: true
  handlers:
    - name: Reiniciar autofs
      ansible.builtin.service:
        name: autofs
        state: restarted
