---
- ansible.builtin.import_playbook: conf-geral.yml
  vars:
    alvo_comum: app
    usar_dns_lab: true

- name: Configurar o servidor de aplicação
  hosts: app
  become: true
  vars_files:
    - vars-lab.yml

  tasks:
    - name: Instalar Apache
      ansible.builtin.apt:
        name: apache2
        state: present
        lock_timeout: 180

    - name: Publicar os dados do projeto
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: '0644'
        content: |
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <title>Projeto 01 - DevOps com Vagrant e Ansible</title>
          </head>
          <body>
            <h1>Projeto 01 - DevOps com Vagrant e Ansible</h1>
            <p>O Vagrant cria quatro máquinas Debian e o Ansible configura a rede,
            o armazenamento e os serviços de arquivos, banco de dados e aplicação.</p>
            <p>Administração de Sistemas Abertos — IFPB</p>
            <p>Professor Leonidas Francisco de Lima Junior</p>
            <ul>
              <li>Wagner Marinho de Andrade Filho — matrícula 20242380004</li>
              <li>Wilson Fillipe do Nascimento Lima — matrícula 20251380021</li>
            </ul>
          </body>
          </html>

    - name: Habilitar e iniciar Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Configurar a montagem automática do NFS
      ansible.builtin.import_tasks: autofs.yml

  handlers:
    - name: Recarregar autofs
      ansible.builtin.service:
        name: autofs
        state: reloaded
