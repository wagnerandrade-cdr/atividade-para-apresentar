---
- name: Configurar servidor de arquivos, NFS e DNS
  hosts: all
  become: true

  vars:
    matricula_wagner: "20242380004"
    matricula_wilson: "20251380021"
    dominio: wagner.wilson.devops
    ip_arq: "192.168.56.1{{ matricula_wagner[-2:] }}"
    ip_db: "192.168.56.1{{ matricula_wilson[-2:] }}"
    ip_app: "192.168.56.1{{ matricula_wagner[-1] }}{{ matricula_wilson[-1] }}"
    nfs_uid: 2000
    nfs_gid: 2000
    discos_lvm:
      - /dev/sdb
      - /dev/sdc
      - /dev/sdd

  tasks:
    - name: Confirmar que os discos extras esperados existem
      ansible.builtin.assert:
        that:
          - (item | basename) in ansible_devices
        fail_msg: "Disco {{ item }} nao encontrado; LVM nao sera alterado."
      loop: "{{ discos_lvm }}"

    - name: Instalar pacotes de LVM, NFS e DNS
      ansible.builtin.apt:
        name:
          - lvm2
          - nfs-kernel-server
          - bind9
        state: present
        update_cache: true
      register: apt_result
      until: apt_result is succeeded
      retries: 4
      delay: 15

    - name: Criar grupo de servico NFS com identificador fixo
      ansible.builtin.group:
        name: nfs-ifpb
        gid: "{{ nfs_gid }}"
        system: true
        state: present

    - name: Criar usuario de servico NFS sem shell nem diretorio pessoal
      ansible.builtin.user:
        name: nfs-ifpb
        uid: "{{ nfs_uid }}"
        group: nfs-ifpb
        shell: /usr/sbin/nologin
        system: true
        create_home: false
        state: present

    - name: Criar volume group dados com os discos extras
      community.general.lvg:
        vg: dados
        pvs: "{{ discos_lvm }}"
        state: present

    - name: Criar logical volume ifpb com 15 GB
      community.general.lvol:
        vg: dados
        lv: ifpb
        size: 15g
        state: present

    - name: Formatar o volume logico como ext4
      community.general.filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb

    - name: Criar ponto de montagem /dados
      ansible.builtin.file:
        path: /dados
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Montar o volume em /dados e registrar no fstab
      ansible.posix.mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        opts: nofail
        state: mounted

    - name: Criar compartilhamento com escrita apenas pela identidade NFS
      ansible.builtin.file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: "0700"

    - name: Exportar NFS mapeando todos os clientes para nfs-ifpb
      ansible.builtin.copy:
        dest: /etc/exports
        owner: root
        group: root
        mode: "0644"
        content: |
          /dados/nfs 192.168.56.0/24(rw,sync,no_subtree_check,all_squash,anonuid={{ nfs_uid }},anongid={{ nfs_gid }})
      notify:
        - Recarregar exportacoes NFS
        - Reiniciar servidor NFS

    - name: Configurar opcoes do Bind9
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"
        content: |
          options {
              directory "/var/cache/bind";
              recursion yes;
              allow-recursion { 192.168.56.0/24; };
              allow-query { 192.168.56.0/24; localhost; };
              forwarders { 1.1.1.1; 8.8.8.8; };
              dnssec-validation auto;
              listen-on { any; };
              listen-on-v6 { any; };
          };
      notify: Reiniciar Bind9

    - name: Declarar zonas DNS direta e reversa
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"
        content: |
          zone "{{ dominio }}" {
              type master;
              file "/etc/bind/db.{{ dominio }}";
          };

          zone "56.168.192.in-addr.arpa" {
              type master;
              file "/etc/bind/db.192.168.56";
          };
      notify: Reiniciar Bind9

    - name: Criar zona DNS direta
      ansible.builtin.copy:
        dest: "/etc/bind/db.{{ dominio }}"
        owner: root
        group: bind
        mode: "0644"
        content: |
          $TTL 604800
          @ IN SOA ns.{{ dominio }}. root.{{ dominio }}. (
              3 604800 86400 2419200 604800 )
          @   IN NS ns.{{ dominio }}.
          @   IN A  {{ ip_arq }}
          ns  IN A  {{ ip_arq }}
          arq IN A  {{ ip_arq }}
          db  IN A  {{ ip_db }}
          app IN A  {{ ip_app }}
      notify: Reiniciar Bind9

    - name: Criar zona DNS reversa
      ansible.builtin.copy:
        dest: /etc/bind/db.192.168.56
        owner: root
        group: bind
        mode: "0644"
        content: |
          $TTL 604800
          @ IN SOA ns.{{ dominio }}. root.{{ dominio }}. (
              3 604800 86400 2419200 604800 )
          @   IN NS ns.{{ dominio }}.
          104 IN PTR arq.{{ dominio }}.
          121 IN PTR db.{{ dominio }}.
          141 IN PTR app.{{ dominio }}.
      notify: Reiniciar Bind9

    - name: Validar configuracao principal do Bind9
      ansible.builtin.command: named-checkconf
      changed_when: false

    - name: Validar zona DNS direta
      ansible.builtin.command: "named-checkzone {{ dominio }} /etc/bind/db.{{ dominio }}"
      changed_when: false

    - name: Validar zona DNS reversa
      ansible.builtin.command: named-checkzone 56.168.192.in-addr.arpa /etc/bind/db.192.168.56
      changed_when: false

  handlers:
    - name: Recarregar exportacoes NFS
      ansible.builtin.command: exportfs -ra

    - name: Reiniciar servidor NFS
      ansible.builtin.service:
        name: nfs-kernel-server
        state: restarted
        enabled: true

    - name: Reiniciar Bind9
      ansible.builtin.service:
        name: bind9
        state: restarted
        enabled: true
