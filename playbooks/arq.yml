---
- ansible.builtin.import_playbook: conf-geral.yml
  vars:
    alvo_comum: arq

- name: Configurar armazenamento, NFS e DNS no servidor de arquivos
  hosts: arq
  become: true
  vars_files:
    - vars-lab.yml
  vars:
    discos_lvm: [/dev/sdb, /dev/sdc, /dev/sdd]

  tasks:
    - name: Instalar LVM, NFS e Bind9
      ansible.builtin.apt:
        name: [lvm2, nfs-kernel-server, bind9]
        state: present
        lock_timeout: 180

    - name: Verificar os três discos adicionais
      ansible.builtin.assert:
        that:
          - disco in ansible_facts.devices
          - ansible_facts.devices[disco].partitions | length == 0
          - ansible_facts.devices[disco].sectors | int * ansible_facts.devices[disco].sectorsize | int == 10737418240
        fail_msg: "{{ item }} precisa ser um dos discos de 10 GiB sem partições criados pelo Vagrant."
      vars:
        disco: "{{ item | basename }}"
      loop: "{{ discos_lvm }}"

    - name: Criar o grupo de volumes dados
      community.general.lvg:
        vg: dados
        pvs: "{{ discos_lvm }}"
        state: present

    - name: Criar o volume lógico ifpb de 15 GiB
      community.general.lvol:
        vg: dados
        lv: ifpb
        size: 15g
        shrink: false
        state: present

    - name: Criar o sistema de arquivos ext4 no volume
      community.general.filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb

    - name: Montar o volume em /dados e registrar no fstab
      ansible.posix.mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        state: mounted

    - name: Criar o grupo do serviço NFS
      ansible.builtin.group:
        name: nfs-ifpb
        system: true
        state: present

    - name: Criar o usuário de serviço NFS sem login
      ansible.builtin.user:
        name: nfs-ifpb
        group: nfs-ifpb
        shell: /usr/sbin/nologin
        system: true
        create_home: false
      register: conta_nfs

    - name: Garantir que apenas nfs-ifpb possa escrever no diretório
      ansible.builtin.file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0755'

    - name: Exportar o diretório com gravação síncrona e mapear os acessos para nfs-ifpb
      ansible.builtin.copy:
        dest: /etc/exports
        mode: '0644'
        content: |
          /dados/nfs {{ rede_lab }}(rw,sync,all_squash,anonuid={{ conta_nfs.uid }},anongid={{ conta_nfs.group }},no_subtree_check)
    - name: Habilitar e iniciar o servidor NFS
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
        enabled: true

    - name: Aplicar as exportações NFS gravadas em disco
      ansible.builtin.command: /usr/sbin/exportfs -ra
      changed_when: false

    - name: Configurar consultas internas e encaminhadores do Bind9
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        mode: '0644'
        content: |
          acl lab { 127.0.0.1; {{ rede_lab }}; };
          options {
              directory "/var/cache/bind";
              listen-on { 127.0.0.1; {{ ip_arq }}; };
              listen-on-v6 { none; };
              allow-query { lab; };
              allow-recursion { lab; };
              recursion yes;
              forward only;
              forwarders { 1.1.1.1; 8.8.8.8; };
              dnssec-validation auto;
          };

    - name: Declarar as zonas direta e reversa
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.local
        mode: '0644'
        content: |
          zone "{{ dominio }}" {
              type master;
              file "/etc/bind/db.{{ dominio }}";
          };
          zone "56.168.192.in-addr.arpa" {
              type master;
              file "/etc/bind/db.192.168.56";
          };

    - name: Criar a zona direta
      ansible.builtin.copy:
        dest: "/etc/bind/db.{{ dominio }}"
        mode: '0644'
        content: |
          $TTL 300
          @ IN SOA ns.{{ dominio }}. root.{{ dominio }}. (3 3600 900 604800 300)
          @   IN NS ns.{{ dominio }}.
          @   IN A  {{ ip_arq }}
          ns  IN A  {{ ip_arq }}
          arq IN A  {{ ip_arq }}
          db  IN A  {{ ip_db }}
          app IN A  {{ ip_app }}

    - name: Criar a zona reversa com os PTRs das máquinas
      ansible.builtin.copy:
        dest: /etc/bind/db.192.168.56
        mode: '0644'
        content: |
          $TTL 300
          @ IN SOA ns.{{ dominio }}. root.{{ dominio }}. (3 3600 900 604800 300)
          @ IN NS ns.{{ dominio }}.
          {{ ip_arq.split('.')[-1] }} IN PTR arq.{{ dominio }}.
          {{ ip_db.split('.')[-1] }}  IN PTR db.{{ dominio }}.
          {{ ip_app.split('.')[-1] }} IN PTR app.{{ dominio }}.

    - name: Validar a configuração e as zonas do Bind9
      ansible.builtin.command: /usr/bin/named-checkconf -z
      changed_when: false

    - name: Habilitar o Bind9 e aplicar a configuração validada
      ansible.builtin.service:
        name: named
        state: restarted
        enabled: true
