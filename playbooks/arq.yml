---
- name: Servidor de arquivos - LVM, NFS e Bind9
  hosts: all
  become: true
  vars:
    dominio: wagner.wilson.devops
    ip_arq: 192.168.56.104
    ip_db: 192.168.56.121
    ip_app: 192.168.56.141
  tasks:
    - name: Instalar LVM, NFS e Bind9
      ansible.builtin.apt:
        name: [lvm2, nfs-kernel-server, bind9, bind9-utils]
        state: present
        update_cache: true

    - name: Conferir se os tres discos adicionais existem
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: [/dev/sdb, /dev/sdc, /dev/sdd]
      register: discos

    - name: Impedir operacoes de LVM se faltar disco
      ansible.builtin.assert:
        that: 'item.stat.exists'
        fail_msg: 'Disco {{ item.item }} ausente; verifique os discos Vagrant antes de continuar.'
      loop: '{{ discos.results }}'

    # O lvg/lvol nao apaga assinaturas nem reformata um volume existente.
    - name: Criar volume group dados nos tres discos
      community.general.lvg:
        vg: dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd
        state: present

    - name: Criar volume logico ifpb com 15 GB
      community.general.lvol:
        vg: dados
        lv: ifpb
        size: 15g
        state: present
        shrink: false

    - name: Formatar volume com ext4 apenas se necessario
      community.general.filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb
        force: false

    - name: Garantir diretorio de montagem
      ansible.builtin.file:
        path: /dados
        state: directory
        mode: '0755'

    - name: Montar /dados permanentemente
      ansible.posix.mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        opts: defaults
        state: mounted

    - name: Criar usuario de servico NFS sem shell
      ansible.builtin.user:
        name: nfs-ifpb
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Descobrir UID de nfs-ifpb
      ansible.builtin.command: id -u nfs-ifpb
      register: nfs_uid
      changed_when: false

    - name: Descobrir GID de nfs-ifpb
      ansible.builtin.command: id -g nfs-ifpb
      register: nfs_gid
      changed_when: false

    - name: Criar NFS somente com escrita pelo usuario nfs-ifpb
      ansible.builtin.file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0700'

    - name: Exportar NFS para rede privada mapeando todos os usuarios
      ansible.builtin.copy:
        dest: /etc/exports
        mode: '0644'
        content: |
          /dados/nfs 192.168.56.0/24(rw,sync,no_subtree_check,all_squash,anonuid={{ nfs_uid.stdout }},anongid={{ nfs_gid.stdout }})
      notify: Reexportar NFS

    - name: Habilitar NFS
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
        enabled: true

    - name: Configurar Bind9 para rede interna
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        mode: '0644'
        content: |
          options {
            directory "/var/cache/bind";
            recursion yes;
            allow-query { localhost; 192.168.56.0/24; };
            allow-recursion { localhost; 192.168.56.0/24; };
            listen-on { any; };
            listen-on-v6 { any; };
            forwarders { 1.1.1.1; 8.8.8.8; };
            dnssec-validation auto;
          };
      notify: Reiniciar Bind9

    - name: Configurar zonas direta e reversa
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.local
        mode: '0644'
        content: |
          zone "{{ dominio }}" {
            type master;
            file "/etc/bind/db.{{ dominio }}";
          };
          zone "56.168.192.in-addr.arpa" {
            type master;
            file "/etc/bind/db.192.168.56";
          };
      notify: Reiniciar Bind9

    - name: Criar zona DNS direta
      ansible.builtin.copy:
        dest: '/etc/bind/db.{{ dominio }}'
        mode: '0644'
        content: |
          $TTL 3600
          @ IN SOA ns.{{ dominio }}. admin.{{ dominio }}. ( 2026111501 3600 900 1209600 3600 )
          @ IN NS ns.{{ dominio }}.
          ns IN A {{ ip_arq }}
          arq IN A {{ ip_arq }}
          db IN A {{ ip_db }}
          app IN A {{ ip_app }}
      notify: Reiniciar Bind9

    - name: Criar zona DNS reversa
      ansible.builtin.copy:
        dest: /etc/bind/db.192.168.56
        mode: '0644'
        content: |
          $TTL 3600
          @ IN SOA ns.{{ dominio }}. admin.{{ dominio }}. ( 2026111501 3600 900 1209600 3600 )
          @ IN NS ns.{{ dominio }}.
          104 IN PTR arq.{{ dominio }}.
          121 IN PTR db.{{ dominio }}.
          141 IN PTR app.{{ dominio }}.
      notify: Reiniciar Bind9

    - name: Validar configuracao Bind9
      ansible.builtin.command: named-checkconf -z
      changed_when: false

    - name: Habilitar Bind9
      ansible.builtin.service:
        name: named
        state: started
        enabled: true

  handlers:
    - name: Reexportar NFS
      ansible.builtin.command: exportfs -ra
    - name: Reiniciar Bind9
      ansible.builtin.service:
        name: named
        state: restarted
