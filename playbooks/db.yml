---
- name: Configuração do Banco de Dados (db)
  hosts: all
  become: true
  vars:
    ip_arq: 192.168.56.104

  tasks:
    # ─── 1. MariaDB ───
    - name: Instalar o servidor MariaDB
      apt:
        name: mariadb-server
        state: present
        update_cache: true
      register: apt_result
      until: apt_result is succeeded
      retries: 4
      delay: 15

    - name: Habilitar e iniciar o MariaDB
      service:
        name: mariadb
        state: started
        enabled: yes

    # ─── 2. Autofs (NFS) ───
    - name: Instalar autofs
      apt:
        name: autofs
        state: present
      register: apt_result
      until: apt_result is succeeded
      retries: 4
      delay: 15

    - name: Criar o diretório /var/nfs
      file:
        path: /var/nfs
        state: directory
        mode: '0755'

    - name: Configurar o auto.nfs para montar a arq
      copy:
        dest: /etc/auto.nfs
        owner: root
        group: root
        mode: "0644"
        content: |
          dados -fstype=nfs4,rw {{ ip_arq }}:/dados/nfs
      notify: Reiniciar autofs

    - name: Adicionar mapa NFS sem substituir os demais mapas
      lineinfile:
        path: /etc/auto.master
        line: "/var/nfs /etc/auto.nfs --timeout=60"
        state: present
      notify: Reiniciar autofs

    - name: Criar ponto de montagem do autofs
      file:
        path: /var/nfs
        state: directory
        owner: root
        group: root
        mode: "0755"

  handlers:
    - name: Reiniciar autofs
      service:
        name: autofs
        state: restarted
        enabled: true
