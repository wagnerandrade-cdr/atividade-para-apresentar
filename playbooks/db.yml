---
- name: Servidor db - MariaDB e NFS por autofs
  hosts: all
  become: true
  tasks:
    - name: Instalar MariaDB e autofs
      ansible.builtin.apt:
        name: [mariadb-server, autofs]
        state: present
        update_cache: true
    - name: Habilitar MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true
    - name: Configurar automontagem direta NFS em /var/nfs
      ansible.builtin.copy:
        dest: /etc/auto.master.d/ifpb.autofs
        mode: '0644'
        content: "/- /etc/auto.ifpb --timeout=60\n"
      notify: Reiniciar autofs
    - name: Configurar mapa de montagem NFS
      ansible.builtin.copy:
        dest: /etc/auto.ifpb
        mode: '0644'
        content: "/var/nfs -fstype=nfs,rw 192.168.56.104:/dados/nfs\n"
      notify: Reiniciar autofs
    - name: Ativar autofs
      ansible.builtin.service:
        name: autofs
        state: started
        enabled: true
  handlers:
    - name: Reiniciar autofs
      ansible.builtin.service:
        name: autofs
        state: restarted
