---
- ansible.builtin.import_playbook: conf-geral.yml
  vars:
    alvo_comum: db
    usar_dns_lab: true

- name: Configurar o servidor de banco de dados
  hosts: db
  become: true
  vars_files:
    - vars-lab.yml

  tasks:
    - name: Instalar MariaDB
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        lock_timeout: 180

    - name: Habilitar e iniciar MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Configurar a montagem automática do NFS
      ansible.builtin.import_tasks: autofs.yml

  handlers:
    - name: Recarregar autofs
      ansible.builtin.service:
        name: autofs
        state: reloaded
