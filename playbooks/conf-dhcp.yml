---
- name: Instala e configura o servidor DHCP na máquina arq
  hosts: all
  become: true
  vars:
    matricula_wagner: "20242380004"
    matricula_wilson: "20251380021"
    dominio: wagner.wilson.devops
    ip_dns: "192.168.56.1{{ matricula_wagner[-2:] }}"
    ip_db: "192.168.56.1{{ matricula_wilson[-2:] }}"
    ip_app: "192.168.56.1{{ matricula_wagner[-1] }}{{ matricula_wilson[-1] }}"
  tasks:
    - name: Instalar o isc-dhcp-server
      apt:
        name: isc-dhcp-server
        state: present
        update_cache: true

    - name: Configurar a interface de escuta
      copy:
        dest: /etc/default/isc-dhcp-server
        owner: root
        group: root
        mode: "0644"
        content: |
          INTERFACESv4="eth1"
          INTERFACESv6=""
      notify: Reiniciar DHCP

    - name: Escrever o arquivo dhcpd.conf com as regras do projeto
      copy:
        dest: /etc/dhcp/dhcpd.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          default-lease-time 180;
          max-lease-time 3600;
          authoritative;
          option domain-name "{{ dominio }}";
          
          option domain-name-servers {{ ip_dns }};

          subnet 192.168.56.0 netmask 255.255.255.0 {
            range 192.168.56.50 192.168.56.100;
            option routers 192.168.56.1;
          }

          host db {
            hardware ethernet 08:00:27:3A:00:DB;
            fixed-address {{ ip_db }};
          }

          host app {
            hardware ethernet 08:00:27:3A:00:A1;
            fixed-address {{ ip_app }};
          }

      notify: Reiniciar DHCP

    - name: Validar configuracao DHCP instalada antes de reiniciar
      command: /usr/sbin/dhcpd -t -cf /etc/dhcp/dhcpd.conf
      changed_when: false

  handlers:
    - name: Reiniciar DHCP
      service:
        name: isc-dhcp-server
        state: restarted
        enabled: true
