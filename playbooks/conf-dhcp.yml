---
- name: DHCP autoritativo na VM arq
  hosts: all
  become: true
  tasks:
    - name: Instalar servidor DHCP
      ansible.builtin.apt:
        name: isc-dhcp-server
        state: present
        update_cache: true
    - name: Selecionar interface privada
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-server
        mode: '0644'
        content: |
          INTERFACESv4="eth1"
          INTERFACESv6=""
      notify: Reiniciar DHCP
    - name: Escrever configuracao do DHCP
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        mode: '0644'
        content: |
          authoritative;
          default-lease-time 180;
          max-lease-time 3600;
          option domain-name "wagner.wilson.devops";
          option domain-name-servers 192.168.56.104;
          subnet 192.168.56.0 netmask 255.255.255.0 {
            range 192.168.56.50 192.168.56.100;
            option routers 192.168.56.1;
          }
          host db {
            hardware ethernet 08:00:27:3A:00:DB;
            fixed-address 192.168.56.121;
          }
          host app {
            hardware ethernet 08:00:27:3A:00:A1;
            fixed-address 192.168.56.141;
          }
      notify: Reiniciar DHCP
    - name: Validar arquivo DHCP instalado
      ansible.builtin.command: /usr/sbin/dhcpd -t -cf /etc/dhcp/dhcpd.conf
      changed_when: false
    - name: Ativar servidor DHCP
      ansible.builtin.service:
        name: isc-dhcp-server
        state: started
        enabled: true
  handlers:
    - name: Reiniciar DHCP
      ansible.builtin.service:
        name: isc-dhcp-server
        state: restarted
